services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${KONTEXT_POSTGRES_DB:-kontext_v2}
      POSTGRES_USER: ${KONTEXT_POSTGRES_USER:-kontext_v2}
      POSTGRES_PASSWORD: ${KONTEXT_POSTGRES_PASSWORD:?KONTEXT_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kontext_v2_postgres:/var/lib/postgresql/data

volumes:
  kontext_v2_postgres:
